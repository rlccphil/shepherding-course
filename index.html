voidance.<\/li>\n\n      <li>Prayer instead of impulsive reactions.<\/li>\n\n    <\/ul>\n\n    <p>\n      People may forget every detail of a difficult conversation, but they rarely\n      forget whether they were treated with dignity, compassion, and respect.\n    <\/p>\n\n  <\/div>\n\n  <!-- Pitfalls -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Common Pitfalls to Avoid<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Avoiding conflict out of fear.<\/li>\n\n      <li>Taking sides before listening carefully.<\/li>\n\n      <li>Using authority to control instead of restore.<\/li>\n\n      <li>Allowing unresolved tensions to linger.<\/li>\n\n    <\/ul>\n\n    <p>\n      Left unattended, conflict gradually weakens trust and diminishes the witness\n      of the church.\n    <\/p>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      Spend time prayerfully reflecting on the questions below.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>How do you usually respond when conflict arises?<\/li>\n\n      <li>What fears make peacemaking difficult for you?<\/li>\n\n      <li>How can you grow in speaking the truth with greater love and humility?<\/li>\n\n      <li>Where might God be inviting you to pursue reconciliation today?<\/li>\n\n    <\/ol>\n\n  <\/div>\n\n  <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      A Final Encouragement\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      Healthy churches are built one relationship at a time. As you walk closely\n      with Christ, ask Him to make you a shepherd who brings peace, restores\n      relationships, and reflects His grace in every conversation.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"If possible, so far as it depends on you, live peaceably with all.\" \u2014 Romans 12:18\n    <\/p>\n\n  <\/div>\n\n<\/div>"}, {"t": "E \u2013 Empower Leaders in the Church", "s": "Multiplying shepherds by trusting and releasing others.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 6\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      E \u2013 Empower Leaders in the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Multiplying shepherds by trusting and releasing others.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"What you have heard from me in the presence of many witnesses entrust to faithful people who will be able to teach others also.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 2 Timothy 2:2\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      Healthy churches multiply leaders rather than concentrate ministry in a few people.\n    <\/p>\n\n    <p>\n      Shepherds are called not only to care for God's people but also to prepare others to share in that responsibility. A church becomes stronger and more resilient when faithful leaders are continually developed and entrusted with meaningful ministry.\n    <\/p>\n\n    <p>\n      Empowering others is not about giving away authority. It is about faithfully stewarding the responsibility God has entrusted to you by helping others grow into theirs.\n    <\/p>\n\n  <\/div>\n\n  <!-- Identifying Leaders -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Recognizing Emerging Leaders<\/h2>\n\n    <p>\n      Shepherds learn to notice faithfulness long before leadership becomes visible.\n    <\/p>\n\n    <p>\n      Emerging leaders are often characterized by:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Faithfulness in ordinary responsibilities.<\/li>\n\n      <li>Teachability and humility.<\/li>\n\n      <li>A genuine love for God and His people.<\/li>\n\n      <li>Consistency of character over time.<\/li>\n\n    <\/ul>\n\n    <p>\n      Giftedness may attract attention, but faithfulness is what prepares people for lasting ministry.\n    <\/p>\n\n  <\/div>\n\n  <!-- Developing Leaders -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Developing Future Leaders<\/h2>\n\n    <p>\n      Empowering leaders requires intentional investment. Shepherds help people grow by walking with them over time.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Teach biblical truth with patience and clarity.<\/li>\n\n      <li>Model a life that reflects Christ.<\/li>\n\n      <li>Provide clear expectations and regular encouragement.<\/li>\n\n      <li>Coach through successes, failures, and difficult seasons.<\/li>\n\n    <\/ul>\n\n    <p>\n      Leadership development is more than transferring knowledge. It is helping people become mature disciples who faithfully serve others.\n    <\/p>\n\n  <\/div>\n\n  <!-- Releasing Leaders -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Entrusting Responsibility<\/h2>\n\n    <p>\n      At some point, shepherds must release others to lead. Trust grows as responsibility is shared with wisdom and ongoing support.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Give meaningful opportunities to serve.<\/li>\n\n      <li>Allow room for learning and growth.<\/li>\n\n      <li>Offer guidance without controlling every decision.<\/li>\n\n      <li>Celebrate faithfulness rather than demanding perfection.<\/li>\n\n    <\/ul>\n\n    <p>\n      Churches flourish when leaders are trusted, encouraged, and supported as they mature.\n    <\/p>\n\n  <\/div>\n\n  <!-- Pitfalls -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Common Pitfalls to Avoid<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Entrusting responsibility too quickly without discernment.<\/li>\n\n      <li>Giving unclear expectations.<\/li>\n\n      <li>Correcting publicly rather than privately.<\/li>\n\n      <li>Feeling threatened by the gifts and abilities of others.<\/li>\n\n    <\/ul>\n\n    <p>\n      Empowering leaders requires wisdom, patience, humility, and confidence that God is building His church.\n    <\/p>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      Spend time prayerfully reflecting on the questions below.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>Who has invested in your growth as a leader?<\/li>\n\n      <li>What fears make it difficult for you to entrust responsibility to others?<\/li>\n\n      <li>Who might God be inviting you to encourage, mentor, or coach?<\/li>\n\n      <li>How can you become more intentional about developing future leaders?<\/li>\n\n    <\/ol>\n\n  <\/div>\n\n  <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      A Final Encouragement\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      One of the greatest gifts a shepherd can leave behind is not a successful ministry, but faithful leaders who continue serving Christ long after he is gone. Invest in people patiently, entrust them to God's grace, and rejoice as He continues His work through them.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"Entrust to faithful people who will be able to teach others also.\" \u2014 2 Timothy 2:2\n    <\/p>\n\n  <\/div>\n\n<\/div>"}, {"t": "R \u2013 Run the Administrative Affairs of the Church", "s": "Stewarding resources, structures, and ministries with faithfulness.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 7\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      R \u2013 Run the Administrative Affairs of the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Stewarding resources, structures, and ministries with faithfulness.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"Moreover, it is required of stewards that they be found faithful.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 1 Corinthians 4:2 (ESV)\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      Administration may not seem as visible as preaching or pastoral care, yet it is an important expression of faithful shepherding.\n    <\/p>\n\n    <p>\n      Every schedule, ministry system, financial decision, and church facility influences how people experience the life of the church. Good administration quietly removes unnecessary obstacles so that people can worship, grow, and serve more effectively.\n    <\/p>\n\n    <p>\n      Faithful administration is not about bureaucracy. It is about loving people through wise stewardship.\n    <\/p>\n\n  <\/div>\n\n  <!-- Stewardship -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Administration as Stewardship<\/h2>\n\n    <p>\n      Shepherds are entrusted with caring not only for people but also for the resources God provides to support His mission.\n    <\/p>\n\n    <p>\n      This stewardship includes:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Facilities that are safe, welcoming, and functional.<\/li>\n\n      <li>Orderly worship services and ministry schedules.<\/li>\n\n      <li>Faithful management of finances and material resources.<\/li>\n\n      <li>Clear policies, records, and communication.<\/li>\n\n    <\/ul>\n\n    <p>\n      Healthy administrative systems quietly support ministry without becoming its focus.\n    <\/p>\n\n  <\/div>\n\n  <!-- Order -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Order That Serves the Mission<\/h2>\n\n    <p>\n      Scripture reminds us that God is a God of peace and order. Order in the church is not about rigid control but about creating an environment where people can flourish.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Reduce unnecessary confusion.<\/li>\n\n      <li>Protect volunteers from burnout.<\/li>\n\n      <li>Encourage teamwork and accountability.<\/li>\n\n      <li>Create space for ministry to thrive.<\/li>\n\n    <\/ul>\n\n    <p>\n      Well-designed systems should quietly support people rather than draw attention to themselves.\n    <\/p>\n\n  <\/div>\n\n  <!-- Responsibilities -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Key Areas of Responsibility<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li><strong>Facilities<\/strong> \u2014 Caring for spaces where ministry takes place.<\/li>\n\n      <li><strong>Gatherings<\/strong> \u2014 Planning worship services and church events thoughtfully.<\/li>\n\n      <li><strong>Finances<\/strong> \u2014 Managing resources with integrity, transparency, and accountability.<\/li>\n\n      <li><strong>Communication<\/strong> \u2014 Providing timely, accurate, and gracious information.<\/li>\n\n    <\/ul>\n\n    <p>\n      These responsibilities may happen behind the scenes, but they make meaningful ministry possible.\n    <\/p>\n\n  <\/div>\n\n  <!-- Pitfalls -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Common Pitfalls to Avoid<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Waiting until problems become crises.<\/li>\n\n      <li>Creating systems that are unnecessarily complicated.<\/li>\n\n      <li>Communicating inconsistently or unclearly.<\/li>\n\n      <li>Handling finances without appropriate accountability.<\/li>\n\n    <\/ul>\n\n    <p>\n      Wise shepherds build trustworthy teams, delegate responsibilities, and continually improve the systems that support the church's mission.\n    <\/p>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      Spend time prayerfully reflecting on the questions below.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>How do you normally think about administration\u2014as a burden or as an opportunity to serve?<\/li>\n\n      <li>Which area of administration challenges you the most?<\/li>\n\n      <li>How can faithful administration demonstrate love for God's people?<\/li>\n\n      <li>What ministry systems in your church could be strengthened or simplified?<\/li>\n\n    <\/ol>\n\n  <\/div>\n\n  <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      A Final Encouragement\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      Faithful administration often happens quietly and behind the scenes, but it reflects a shepherd's love for both God and His people. As you steward the resources entrusted to you with wisdom and integrity, you help create an environment where the church can flourish and Christ can be glorified.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"Moreover, it is required of stewards that they be found faithful.\" \u2014 1 Corinthians 4:2\n    <\/p>\n\n  <\/div>\n\n<\/div>"}, {"t": "D \u2013 Design Effective Systems in the Church", "s": "Creating structures that serve people and sustain God's mission.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 8\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      D \u2013 Design Effective Systems in the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Creating structures that serve people and sustain God's mission.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"But all things should be done decently and in order.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 1 Corinthians 14:40 (ESV)\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      Every church functions through systems, whether they are carefully designed or simply develop over time.\n    <\/p>\n\n    <p>\n      Systems influence how people first connect with the church, grow as disciples, discover opportunities to serve, receive pastoral care, and develop into leaders. Healthy systems quietly remove unnecessary barriers so people can flourish in Christ.\n    <\/p>\n\n    <p>\n      Designing effective systems is not merely an administrative responsibility. It is an expression of pastoral stewardship and love for God's people.\n    <\/p>\n\n  <\/div>\n\n  <!-- Systems -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">What Are Ministry Systems?<\/h2>\n\n    <p>\n      A ministry system is a simple, repeatable process that helps the church consistently fulfill its mission.\n    <\/p>\n\n    <p>\n      Healthy systems answer practical questions such as:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>How do people move from attending to belonging?<\/li>\n\n      <li>How are disciples equipped for ministry?<\/li>\n\n      <li>How are leaders identified and developed?<\/li>\n\n      <li>How is pastoral care provided when needs arise?<\/li>\n\n    <\/ul>\n\n    <p>\n      Good systems serve people. They should never become more important than the people they exist to help.\n    <\/p>\n\n  <\/div>\n\n  <!-- Flow -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Thinking About Ministry Flow<\/h2>\n\n    <p>\n      Shepherds learn to think not only about individual ministries but also about how people move through the life of the church.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li><strong>Welcome<\/strong> \u2014 How do people begin connecting?<\/li>\n\n      <li><strong>Formation<\/strong> \u2014 How are they growing in Christ?<\/li>\n\n      <li><strong>Participation<\/strong> \u2014 How are they serving alongside others?<\/li>\n\n      <li><strong>Multiplication<\/strong> \u2014 How are they becoming disciple-makers and leaders?<\/li>\n\n    <\/ul>\n\n    <p>\n      Healthy systems make these next steps clear, simple, and accessible.\n    <\/p>\n\n  <\/div>\n\n  <!-- Simplicity -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Simple Systems Last Longer<\/h2>\n\n    <p>\n      Effective ministry systems are rarely complicated. They are clear enough for ordinary people to understand and flexible enough to grow with the church.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Keep processes simple and easy to explain.<\/li>\n\n      <li>Remove unnecessary complexity.<\/li>\n\n      <li>Align every system with the church's mission and values.<\/li>\n\n      <li>Design systems that continue even when leaders change.<\/li>\n\n    <\/ul>\n\n    <p>\n      If a ministry only works because one person keeps everything together, the system needs strengthening.\n    <\/p>\n\n  <\/div>\n\n  <!-- Shepherd's Heart -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Design with a Shepherd's Heart<\/h2>\n\n    <p>\n      Every ministry system should ultimately help people know Christ, grow in faith, and participate in His mission.\n    <\/p>\n\n    <p>\n      Wise shepherds regularly ask:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Does this help people take meaningful next steps?<\/li>\n\n      <li>Does it strengthen rather than burden our volunteers?<\/li>\n\n      <li>Does it reflect our biblical convictions?<\/li>\n\n      <li>Does it make pastoral care more personal rather than more distant?<\/li>\n\n    <\/ul>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      As you complete this course, prayerfully consider the questions below.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>How have healthy\u2014or unhealthy\u2014systems shaped your experience of church life?<\/li>\n\n      <li>Where do you see unnecessary barriers in your current ministry context?<\/li>\n\n      <li>How could a better system help people experience greater care and spiritual growth?<\/li>\n\n      <li>What is one ministry process you would like to improve in the future?<\/li>\n\n    <\/ol>\n\n  <\/div>\n\n  <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      Congratulations!\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      You have completed the <strong>SHEPHERD<\/strong> journey. Along the way, you have explored God's vision for the church, faithful stewardship, equipping believers, soul care, peacemaking, leadership development, administration, and ministry systems. These lessons are not simply techniques to master\u2014they are invitations to become the kind of shepherd who reflects the heart of Christ.\n    <\/p>\n\n    <p style=\"margin-top:18px;color:#4b5563;\">\n      Continue walking closely with the Lord, serving His people with humility, and trusting Him to shape both your character and your calling. May He use your life to strengthen His church for many years to come.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"And when the Chief Shepherd appears, you will receive the unfading crown of glory.\" \u2014 1 Peter 5:4\n    <\/p>\n\n  <\/div>\n\n<\/div>"}];
const COURSES={heart:{n:"Course 1: The Heart of a Shepherd",d:HEART},art:{n:"Course 2: The Art of Shepherding",d:ART}};
const $=s=>document.querySelector(s),app=$('#app');
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let user=ls.get('haas_user');
const done=()=>ls.get('haas_done')||{};
async function api(body){
  if(API_URL.startsWith("PASTE"))return{ok:false,msg:'The site is not connected yet. Add the Apps Script URL in index.html.'};
  try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return await r.json()}
  catch(e){return{ok:false,msg:'Could not reach the server. Check your connection and try again.'}}
}
function authView(){
  $('#nav').classList.add('hide');
  app.innerHTML=`<div class="auth card"><h2>Welcome, shepherd</h2><p>Sign up with your name and email. Once you are approved you will receive a passcode to log in.</p>
  <div class="tabs"><button id="tl" class="on">Log in</button><button id="ts">Sign up</button></div>
  <form id="f" novalidate><div id="nm" class="hide"><label>Full name<input id="name" autocomplete="name"></label></div>
  <label>Email<input id="email" type="email" autocomplete="email"></label>
  <div id="pc"><label>Passcode<input id="pass" type="password" autocomplete="current-password"></label></div>
  <div class="row"><button class="btn" id="go">Log in</button></div></form><div id="m"></div></div>`;
  let mode='login';
  const set=m=>{mode=m;$('#tl').classList.toggle('on',m=='login');$('#ts').classList.toggle('on',m=='signup');$('#nm').classList.toggle('hide',m=='login');$('#pc').classList.toggle('hide',m=='signup');$('#go').textContent=m=='login'?'Log in':'Request access';$('#m').innerHTML=''};
  $('#tl').onclick=()=>set('login');$('#ts').onclick=()=>set('signup');
  $('#f').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim(),name=$('#name').value.trim(),pass=$('#pass').value.trim();
    const bad=t=>$('#m').innerHTML=`<div class="msg err">${t}</div>`;
    if(!/^\S+@\S+\.\S+$/.test(email))return bad('Please enter a valid email.');
    if(mode=='signup'&&name.length<2)return bad('Please enter your name.');
    if(mode=='login'&&!pass)return bad('Please enter your passcode.');
    $('#go').disabled=true;$('#m').innerHTML='<div class="msg">One moment…</div>';
    const r=await api(mode=='signup'?{action:'signup',name,email}:{action:'login',email,passcode:pass});
    $('#go').disabled=false;
    if(!r.ok)return bad(r.msg||'Something went wrong.');
    if(mode=='signup'){$('#m').innerHTML=`<div class="msg">${r.msg}</div>`;return}
    user={name:r.name,email};ls.set('haas_user',user);route()};
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt=c=>{const d=done();return COURSES[c].d.filter((_,i)=>d[c+i]).length};
const home=()=>`<div class="card"><h3>Welcome back, ${esc(user.name.split(' ')[0])}</h3>`+
  ['heart','art'].map(c=>{const n=cnt(c),L=COURSES[c].d.length;return`<p style="margin:14px 0 0"><strong>${COURSES[c].n}</strong></p><div class="prog"><i style="width:${Math.round(n/L*100)}%"></i></div><small>${n} of ${L} complete</small>`}).join('')+
  `<div class="row"><a class="btn" href="#heart">Heart</a><a class="btn" href="#art">Art</a><a class="btn alt" href="#practicum">Practicum</a></div></div><div class="tas-wrapper" style="margin-top:18px">${LANDING}</div>`;
function list(c){const d=done();
  return`<div class="card"><h2>${COURSES[c].n}</h2><p>Work through each lesson prayerfully, in order.</p>`+
  COURSES[c].d.map((l,i)=>`<a class="lesson" href="#${c}-${i}"><span class="num ${d[c+i]?'done':''}">${d[c+i]?'✓':i}</span><span><strong>${i?(c=='heart'?'Lesson '+i+': ':'')+esc(l.t):'Welcome: '+esc(l.t)}</strong><small>${esc(l.s)}</small></span></a>`).join('')+`</div>`}
function lesson(c,i){const D=COURSES[c].d,l=D[i],d=done(),last=i==D.length-1,nx=c=='heart'?'#art':'#practicum';
  return`<div class="${c=='heart'?'pil-course':'art'}">${l.h}</div><div class="pager"><div>${i>0?`<a class="btn alt" href="#${c}-${i-1}">← Previous</a>`:`<a class="btn alt" href="#${c}">← Lessons</a>`}</div>
  <button class="btn alt" id="mk">${d[c+i]?'✓ Completed':'Mark complete'}</button>
  <div>${!last?`<a class="btn" href="#${c}-${i+1}">Next →</a>`:`<a class="btn" href="${nx}">${c=='heart'?'On to the Art course →':'On to Practicum →'}</a>`}</div></div>`}
const prac=()=>`<div class="card"><h2>Practicum</h2><p>Put what you are learning into practice. The practicum opens in a new tab.</p><div class="row"><a class="btn" href="${PRACTICUM}" target="_blank" rel="noopener">Open the Practicum ↗</a></div></div>`;
function route(){
  if(!user)return authView();
  $('#nav').classList.remove('hide');
  const h=(location.hash||'#home').slice(1);let v,k=h,m=h.match(/^(heart|art)-(\d+)$/);
  if(m&&COURSES[m[1]].d[+m[2]]){v=lesson(m[1],+m[2]);k=m[1]}
  if(!v){k={heart:1,art:1,practicum:1}[h]?h:'home';v=k=='home'?home():k=='practicum'?prac():list(k)}
  app.innerHTML=v;scrollTo(0,0);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+k));
  const mk=$('#mk');if(mk&&m)mk.onclick=()=>{const d=done(),key=m[1]+m[2];d[key]=!d[key];if(!d[key])delete d[key];ls.set('haas_done',d);mk.textContent=d[key]?'✓ Completed':'Mark complete'};
}
$('#out').onclick=()=>{ls.del('haas_user');user=null;route()};
addEventListener('hashchange',route);route();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
