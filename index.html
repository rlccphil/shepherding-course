<script>

const API_URL="https://script.google.com/macros/s/AKfycbzYFyGarRKcRs9Bc5pIyKoqkbUBSkFSZnGi_yt67YNffCE13XNbek_XqgfcGhpj_L0tww/exec";
const PRACTICUM="https://shepherding-ministry-bkvk.bolt.host/";
const LANDING="\n\n<div class=\"tas-header\">\n\n<h1>The Heart and Art of Shepherding</h1>\n\n<p>\nA two-course journey for those who desire to shepherd God's people with Christlike character and faithful pastoral wisdom.\n</p>\n\n</div>\n\n<div class=\"tas-intro\">\n\n<p>\nPastoral ministry requires more than a willing heart or practical ability alone. Faithful shepherds are formed both <strong>from the inside out</strong> and through the faithful practice of ministry. God shapes the shepherd's character while also developing the wisdom, discernment, and skills needed to care well for His people.\n</p>\n\n<p>\nThis collection brings together two complementary mini courses that provide a biblical foundation for pastoral ministry. Together they explore both the <strong>heart</strong> and the <strong>art</strong> of shepherding, helping emerging leaders grow into faithful servants of Jesus Christ, the Chief Shepherd.\n</p>\n\n</div>\n\n<div class=\"tas-section-title\">\nMini Courses\n</div>\n\n<div class=\"tas-grid\">\n\n<div class=\"tas-card\">\n\n<div class=\"tas-tag\">\nCourse 1\n</div>\n\n<h3>The Heart of a Shepherd</h3>\n\n<p>\nHealthy ministry begins with a healthy soul. This course explores the inner life of the shepherd by cultivating intimacy with Christ, spiritual disciplines, Christlike character, humility, emotional maturity, integrity, and rhythms that sustain a lifetime of faithful ministry.\n</p>\n\n</div>\n\n<div class=\"tas-card\">\n\n<div class=\"tas-tag\">\nCourse 2\n</div>\n\n<h3>The Art of Shepherding</h3>\n\n<p>\nFaithful shepherding is both a calling and a craft. This course introduces the essential practices of pastoral ministry, including equipping God's people, providing soul care, nurturing healthy relationships, developing leaders, stewarding resources wisely, and designing ministries that help the church flourish.\n</p>\n\n</div>\n\n</div>\n\n<div class=\"tas-callout\">\n\n<h2>Why These Two Courses Belong Together</h2>\n\n<p>\nA shepherd's ministry should never exceed the maturity of the shepherd's heart. Character without competence limits ministry, while competence without character eventually harms it. God desires both. He forms the <strong>heart</strong> before refining the <strong>art</strong>, so that faithful ministry flows from a life that is deeply rooted in Christ.\n</p>\n\n</div>\n\n<div class=\"tas-list\">\n\n<h2>How to Get the Most from These Courses</h2>\n\n<ul>\n\n<li>Complete the courses in the order they are presented.</li>\n\n<li>Move through each lesson prayerfully rather than quickly.</li>\n\n<li>Reflect honestly on the questions provided.</li>\n\n<li>Submit each reflection as part of your learning journey.</li>\n\n<li>Discuss what you are learning with a pastor or ministry mentor whenever possible.</li>\n\n<li>Ask God not only to increase your knowledge but also to transform your heart.</li>\n\n</ul>\n\n</div>\n\n<div class=\"tas-footer\">\n\n<h2>\nA Prayer for Your Journey\n</h2>\n\n<p>\nMay the Lord continue to form your heart as you learn the art of shepherding. As you walk with Christ, may He give you wisdom to lead, compassion to care, courage to speak the truth in love, and humility to serve His people faithfully. Above all, may your ministry always reflect the heart of the Chief Shepherd.\n</p>\n\n<div class=\"tas-verse\">\n\"And when the Chief Shepherd appears, you will receive the unfading crown of glory.\" \u2014 1 Peter 5:4\n</div>\n\n</div>\n\n";
const HEART=[{"t": "The Pastor's Inner Life", "s": "Welcome\u2014beginning the journey beneath the ministry.", "h": "\n\n  <div class=\"banner\">\n    <h1>The Pastor's Inner Life<\/h1>\n    <p>Welcome\u2014beginning the journey beneath the ministry.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>Welcome<\/h2>\n\n    <p><strong>Before shepherds care for souls, God first cares for the shepherd.<\/strong><\/p>\n\n    <p>\n      This course begins not with ministry skills but with the heart. Faithful ministry grows\n      from a life that is continually being formed by Christ. While preaching, leadership,\n      and pastoral care are essential, they become fruitful only as they flow from deep\n      communion with God.\n    <\/p>\n\n    <div class=\"quote\">\n      \"Keep a close watch on yourself and on the teaching.\" \u2014 1 Timothy 4:16\n    <\/div>\n\n    <p>\n      Throughout Scripture, God shapes His servants before entrusting them with greater\n      responsibility. Public leadership flows from private devotion, and lasting influence\n      grows from an abiding relationship with Christ.\n    <\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>What This Course Is About<\/h2>\n\n    <ul>\n      <li>Cultivating a life with God, not merely a life for God<\/li>\n      <li>Learning to minister from communion rather than pressure<\/li>\n      <li>Recognizing the warning signs of spiritual dryness and burnout<\/li>\n      <li>Practicing rhythms that sustain lifelong faithfulness<\/li>\n      <li>Allowing Christ to shape character before expanding influence<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>How to Use This Course<\/h2>\n\n    <ul>\n      <li>Read each lesson slowly and prayerfully.<\/li>\n      <li>Pause often to reflect before moving on.<\/li>\n      <li>Resist the temptation to rush through the material.<\/li>\n      <li>Return to the spiritual practices regularly.<\/li>\n      <li>Invite the Holy Spirit to search and transform your heart.<\/li>\n    <\/ul>\n\n    <p>\n      This is not merely a course to complete. It is a journey to revisit throughout your\n      ministry as God continues His work of forming you into the likeness of Christ.\n    <\/p>\n  <\/div>\n\n  <div class=\"closing\">\n    <strong>Christ Forms the Shepherd Before He Shepherds Through Him<\/strong>\n\n    Lasting ministry is sustained not by talent or effort alone, but by abiding in Christ day by day.\n\n    <em>\"Apart from Me you can do nothing.\" \u2014 John 15:5<\/em>\n  <\/div>\n\n"}, {"t": "The Shepherd Before the Ministry", "s": "God forms the person before He entrusts the people.", "h": "\n\n  <div class=\"banner\">\n    <h1>The Shepherd Before the Ministry<\/h1>\n    <p>God forms the person before He entrusts the people.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <p><strong>Faithful pastoral ministry always flows from a faithful walk with God.<\/strong><\/p>\n\n    <p>\n      Before Scripture speaks about leading the flock, it speaks about walking with the\n      Shepherd. Before pastors feed others, they must first learn to be nourished by the\n      presence of Christ. Ministry is never meant to replace communion with God.\n    <\/p>\n\n    <p>\n      Many ministry struggles are not primarily problems of skill but of the soul.\n      Programs cannot compensate for prayerlessness, activity cannot replace abiding,\n      and effectiveness cannot substitute for intimacy with Christ. God's deepest work\n      in a pastor is not merely through him but in him.\n    <\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>Jesus' Pattern for Ministry<\/h2>\n\n    <p>\n      In <strong>Mark 3:14<\/strong>, Jesus appointed the Twelve \"that they might be with Him\n      and that He might send them out to preach.\" Notice the order:\n      <strong>being with Him comes before being sent by Him.<\/strong>\n    <\/p>\n\n    <div class=\"callout\">\n      Ministry begins with presence before responsibility.\n    <\/div>\n\n    <p>\n      The disciples' authority did not come merely from training or experience.\n      It grew out of their daily relationship with Jesus. Their public ministry\n      flowed from their private fellowship with Him.\n    <\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>The Danger of Functional Ministry<\/h2>\n\n    <p>\n      A pastor can slowly become a religious professional\u2014preaching sermons,\n      leading meetings, solving problems, and caring for people\u2014while the heart\n      quietly grows distant from God. Ministry may continue outwardly, yet lose\n      its spiritual vitality inwardly.\n    <\/p>\n\n    <ul>\n      <li>You teach about prayer but rarely linger in prayer yourself.<\/li>\n      <li>You guide others spiritually while feeling spiritually dry.<\/li>\n      <li>You prepare sermons without first allowing God's Word to shape your own heart.<\/li>\n    <\/ul>\n\n    <p>\n      This is not necessarily hypocrisy; often it is simply drift. And spiritual drift\n      usually happens slowly and quietly.\n    <\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>God's Priority for Every Shepherd<\/h2>\n\n    <p>\n      <strong>1 Timothy 4:16<\/strong> begins with these words:\n      <em>\"Keep a close watch on yourself and on the teaching.\"<\/em>\n      Notice again the order: <strong>your life before your doctrine.<\/strong>\n    <\/p>\n\n    <p>\n      God cares deeply about sound teaching, but He also cares about the person\n      who proclaims it. He shepherds His people by first shepherding the shepherd.\n    <\/p>\n\n    <p>\n      Before asking, \"How effective is your ministry?\" the Lord gently asks,\n      \"How is your heart before Me?\"\n    <\/p>\n  <\/div>\n\n  <div class=\"closing\">\n    <strong>Reflection<\/strong>\n\n    Before asking God to use you, ask Him to form you. The health of your ministry\n    will rarely exceed the health of your walk with Christ.\n\n    <em>\"Abide in me, and I in you.\" \u2014 John 15:4<\/em>\n  <\/div>\n\n"}, {"t": "Abiding Before Leading", "s": "Learning to live from communion with Christ rather than the pressure of ministry.", "h": "\n\n  <div class=\"banner\">\n    <h1>Abiding Before Leading<\/h1>\n    <p>Learning to live from communion with Christ rather than the pressure of ministry.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <p><strong>Jesus never separated fruitfulness from fellowship.<\/strong><\/p>\n\n    <p>\n      In John 15, Jesus did not tell His disciples to try harder or accomplish more.\n      Instead, He invited them into a life of continual communion with Him:\n      <em>\"Abide in me, and I in you.\"<\/em> Genuine ministry is not sustained by effort\n      alone but by a living relationship with Christ.\n    <\/p>\n\n    <div class=\"callout\">\n      \"Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing.\" \u2014 John 15:5\n    <\/div>\n\n    <p>\n      Pastors often feel responsible to produce growth, solve problems, and meet endless\n      needs. Yet Jesus reminds us that our first responsibility is not producing fruit,\n      but remaining in Him. We abide; God brings the harvest.\n    <\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>The Subtle Pressure of Ministry<\/h2>\n\n    <p>\n      Ministry naturally creates urgency. People need guidance. Problems require wisdom.\n      Decisions cannot always wait. Over time, however, the pastor can begin living in\n      constant reaction instead of continual communion with God.\n    <\/p>\n\n    <ul>\n      <li>Prayer becomes preparation rather than relationship.<\/li>\n      <li>Scripture becomes sermon material rather than daily nourishment.<\/li>\n      <li>Time alone with God becomes optional instead of essential.<\/li>\n    <\/ul>\n\n    <p>\n      When this happens, we may continue serving faithfully while our souls quietly drift\n      from the One we serve.\n    <\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>Practicing Abiding<\/h2>\n\n    <p>\n      Abiding is more than having a daily devotional. It is learning to return to Christ\n      throughout the day, allowing His presence to shape every conversation, decision,\n      and responsibility.\n    <\/p>\n\n    <ul>\n      <li>Offer short prayers between meetings and responsibilities.<\/li>\n      <li>Read Scripture first to listen before preparing to teach.<\/li>\n      <li>Pause before responding so your words flow from God's presence.<\/li>\n      <li>End each day by reflecting with gratitude and honesty before the Lord.<\/li>\n    <\/ul>\n\n    <p>\n      As abiding becomes a rhythm of life, ministry changes from striving to participating\n      in what God is already doing.\n    <\/p>\n  <\/div>\n\n  <div class=\"section\">\n    <h2>The Fruit of Abiding<\/h2>\n\n    <p>\n      When a shepherd remains close to Christ, the character of leadership gradually\n      changes.\n    <\/p>\n\n    <ul>\n      <li>Decisions become calmer and wiser.<\/li>\n      <li>Words become gentler and more gracious.<\/li>\n      <li>Anxiety gives way to quiet confidence in God.<\/li>\n      <li>People experience genuine care rather than merely efficient management.<\/li>\n    <\/ul>\n\n    <p>\n      The influence of a pastor ultimately grows not through force of personality,\n      but through the quiet presence of Christ reflected in daily life.\n    <\/p>\n  <\/div>\n\n  <div class=\"closing\">\n    <strong>Reflection<\/strong>\n\n    Where in your ministry are you striving instead of abiding? Invite the Lord to draw\n    you back into deeper fellowship with Him, trusting that lasting fruit grows from a\n    life rooted in His presence.\n\n    <em>\"Abide in me, and I in you.\" \u2014 John 15:4<\/em>\n  <\/div>\n\n"}, {"t": "Guarding the Heart", "s": "Watching over the inner life God has entrusted to you.", "h": "\n\n  <div class=\"banner\">\n    <h1>Guarding the Heart<\/h1>\n    <p>Watching over the inner life God has entrusted to you.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n\n    <p><strong>Before a pastor guards the church, he must first guard his own heart.<\/strong><\/p>\n\n    <p>\n      Scripture repeatedly connects faithful leadership with a healthy inner life.\n      Ministry failures may become visible in public, but they almost always begin\n      with a quiet drift of the heart. Long before actions change, desires,\n      affections, and priorities begin to shift.\n    <\/p>\n\n    <div class=\"callout\">\n      \"Above all else, guard your heart, for everything you do flows from it.\"\n      \u2014 Proverbs 4:23\n    <\/div>\n\n    <p>\n      The heart shapes our words, attitudes, decisions, and relationships.\n      When it becomes weary, wounded, or distracted, our ministry gradually\n      reflects that condition\u2014even when outward activity continues.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>How the Heart Drifts<\/h2>\n\n    <p>\n      Spiritual drift rarely begins with open rebellion. More often it begins\n      with subtle substitutions that slowly move Christ away from the center\n      of our lives.\n    <\/p>\n\n    <ul>\n      <li>Serving God replaces loving God.<\/li>\n      <li>Explaining Scripture replaces listening to God.<\/li>\n      <li>Helping people replaces depending on God.<\/li>\n      <li>Busyness replaces attentiveness to His presence.<\/li>\n    <\/ul>\n\n    <p>\n      Ministry may continue successfully on the outside while the soul quietly\n      grows tired, guarded, and distant from the Lord.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Common Threats to a Pastor's Heart<\/h2>\n\n    <ul>\n      <li><strong>Discouragement<\/strong> \u2014 when hopes remain unfulfilled over time.<\/li>\n      <li><strong>Comparison<\/strong> \u2014 measuring your ministry against others.<\/li>\n      <li><strong>Resentment<\/strong> \u2014 allowing unresolved disappointments to harden the heart.<\/li>\n      <li><strong>Pride<\/strong> \u2014 finding identity in usefulness rather than in Christ.<\/li>\n      <li><strong>Emotional exhaustion<\/strong> \u2014 continually giving without receiving God's renewing grace.<\/li>\n    <\/ul>\n\n    <p>\n      Left unchecked, these struggles not only affect the pastor\u2014they shape the\n      way the pastor sees God, the church, and the people he is called to love.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Practices That Guard the Heart<\/h2>\n\n    <p>\n      Guarding the heart is not about becoming defensive. It is about remaining\n      open and responsive to God's transforming work day after day.\n    <\/p>\n\n    <ul>\n      <li>Practice regular confession before the Lord.<\/li>\n      <li>Pray honestly rather than merely formally.<\/li>\n      <li>Cultivate trusted spiritual friendships.<\/li>\n      <li>Receive care as willingly as you give it.<\/li>\n      <li>Remember that your identity rests in Christ, not in your ministry role.<\/li>\n    <\/ul>\n\n    <p>\n      As we continually return to Christ, He softens our hearts, renews our\n      affections, and enables us to shepherd others with humility and grace.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"closing\">\n\n    <strong>Reflection<\/strong>\n\n    Ask the Lord today: <em>What is quietly shaping my heart right now\u2014Your presence or the pressures around me?<\/em> Invite Him to search you, renew you, and keep your heart tender before Him.\n\n    <em>\"Search me, O God, and know my heart.\" \u2014 Psalm 139:23<\/em>\n\n  <\/div>\n\n"}, {"t": "Learning to Rest", "s": "Receiving Sabbath as an act of trust rather than an interruption to ministry.", "h": "\n\n  <div class=\"banner\">\n    <h1>Learning to Rest<\/h1>\n    <p>Receiving Sabbath as an act of trust rather than an interruption to ministry.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n\n    <p><strong>Faithful shepherds learn not only how to work well, but also how to rest well.<\/strong><\/p>\n\n    <p>\n      Ministry opportunities never seem to end. Sermons must be prepared, people need care,\n      and new responsibilities continually arise. Yet God commands His servants to rest,\n      not because the work is unimportant, but because He alone is able to sustain His church.\n    <\/p>\n\n    <div class=\"callout\">\n      \"It is in vain that you rise up early and go late to rest... for he gives to his beloved sleep.\"\n      \u2014 Psalm 127:2\n    <\/div>\n\n    <p>\n      Sabbath reminds us that the church belongs to Christ, not to us. We are called to\n      serve faithfully, but we are never called to carry what only God can bear.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>The Spiritual Meaning of Rest<\/h2>\n\n    <p>\n      Biblical rest is far more than recovering from exhaustion. It is an act of worship\n      that expresses trust in God's faithful care and sovereign rule.\n    <\/p>\n\n    <ul>\n      <li>We stop working to remember that we are not the Savior.<\/li>\n      <li>We pause from ministry to renew our delight in God.<\/li>\n      <li>We receive God's gifts instead of constantly producing results.<\/li>\n      <li>We remember that our identity rests in Christ, not in our productivity.<\/li>\n    <\/ul>\n\n    <p>\n      Without intentional rhythms of rest, ministry can gradually become an expression\n      of self-reliance rather than dependence on God.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Why Shepherds Resist Rest<\/h2>\n\n    <p>\n      Even when we know rest is important, we often struggle to embrace it.\n      Beneath our busyness may be deeper fears and misplaced identities.\n    <\/p>\n\n    <ul>\n      <li>Fear of falling behind.<\/li>\n      <li>Guilt when we are not helping others.<\/li>\n      <li>Finding our worth in being useful.<\/li>\n      <li>Feeling that ministry opportunities can never wait.<\/li>\n    <\/ul>\n\n    <p>\n      Sometimes we avoid rest not because people truly cannot manage without us,\n      but because resting exposes how deeply we need to trust God.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Practicing Sabbath<\/h2>\n\n    <p>\n      Sabbath is a rhythm that reminds us every week that God is at work even when\n      we are not. Consider these simple practices.\n    <\/p>\n\n    <ul>\n      <li>Set aside a consistent day each week for rest and renewal.<\/li>\n      <li>Step away from ministry responsibilities as much as possible.<\/li>\n      <li>Enjoy activities that refresh your body, mind, and soul.<\/li>\n      <li>Spend unhurried time with God in worship, prayer, and Scripture.<\/li>\n      <li>Receive the day as a gift rather than another task to accomplish.<\/li>\n    <\/ul>\n\n    <p>\n      Sabbath is not laziness or inactivity. It is worship expressed through trust,\n      reminding us that God continues His work while we rest in Him.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"closing\">\n\n    <strong>Reflection<\/strong>\n\n    Where are you living as though the health of the church depends on you? Bring those\n    burdens before the Lord this week and allow Him to remind you that He is the Chief Shepherd.\n\n    <em>\"Come to me, all who labor and are heavy laden, and I will give you rest.\" \u2014 Matthew 11:28<\/em>\n\n  <\/div>\n\n"}, {"t": "Carrying Discouragement Honestly", "s": "Bringing a weary heart into the presence of God.", "h": "\n\n  <div class=\"banner\">\n    <h1>Carrying Discouragement Honestly<\/h1>\n    <p>Bringing a weary heart into the presence of God.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n\n    <p><strong>Every faithful shepherd will experience seasons of discouragement.<\/strong><\/p>\n\n    <p>\n      Spiritual maturity does not make us immune to weariness. Throughout Scripture,\n      some of God's most faithful servants walked through moments of deep emotional\n      exhaustion. Discouragement is not necessarily a sign of weak faith; it is often\n      a reminder that we are finite people who continually need God's sustaining grace.\n    <\/p>\n\n    <div class=\"callout\">\n      \"It is enough; now, O LORD, take away my life.\" \u2014 1 Kings 19:4\n    <\/div>\n\n    <p>\n      Elijah expected correction, but God first gave him rest, nourishment, and His\n      gentle presence. Before giving fresh direction, the Lord cared for His weary servant.\n      He still shepherds His servants with the same compassion today.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Why Pastors Hide Discouragement<\/h2>\n\n    <p>\n      Many pastors struggle silently because they believe they must always appear strong.\n      Yet hidden discouragement often becomes heavier simply because it remains unspoken.\n    <\/p>\n\n    <ul>\n      <li>The expectation to remain strong for everyone else.<\/li>\n      <li>Fear of disappointing those who look to us for leadership.<\/li>\n      <li>Confusing genuine faith with constant emotional confidence.<\/li>\n      <li>Lacking trusted relationships where honesty feels safe.<\/li>\n    <\/ul>\n\n    <p>\n      What remains hidden before God and trusted companions often grows into isolation,\n      making it harder to receive the grace that God freely offers.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>God's Way of Restoring the Weary<\/h2>\n\n    <p>\n      God's response to weary shepherds is marked by patience and compassion rather\n      than condemnation.\n    <\/p>\n\n    <ul>\n      <li>He listens before He corrects.<\/li>\n      <li>He restores before He sends.<\/li>\n      <li>He reminds us that we are never alone.<\/li>\n      <li>He speaks with gentleness that renews hope.<\/li>\n    <\/ul>\n\n    <p>\n      The Lord is not only the Shepherd of His people; He is also the Shepherd of\n      every pastor. He patiently restores those who come to Him with honest hearts.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Practicing Honest Prayer<\/h2>\n\n    <p>\n      Honest prayer is not a sign of spiritual weakness. Throughout the Psalms we see\n      God's people bringing every emotion before Him with confidence that He hears.\n    <\/p>\n\n    <ul>\n      <li>Tell God what you are truly feeling.<\/li>\n      <li>Name your disappointments honestly.<\/li>\n      <li>Entrust outcomes that you cannot control to Him.<\/li>\n      <li>Receive His presence before searching for solutions.<\/li>\n    <\/ul>\n\n    <p>\n      The goal of prayer is not merely emotional relief but renewed fellowship with\n      the Lord, whose presence strengthens weary hearts.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"closing\">\n\n    <strong>Reflection<\/strong>\n\n    Where have you been pretending to be stronger than you really are? Bring your\n    discouragement honestly before the Lord this week and allow Him to meet you with\n    His compassion and grace.\n\n    <em>\"The LORD is near to the brokenhearted and saves the crushed in spirit.\" \u2014 Psalm 34:18<\/em>\n\n  <\/div>\n\n"}, {"t": "Confession and Returning", "s": "Living in the light before leading others into it.", "h": "\n\n  <div class=\"banner\">\n    <h1>Confession and Returning<\/h1>\n    <p>Living in the light before leading others into it.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n\n    <p><strong>Pastors never outgrow the need for repentance.<\/strong><\/p>\n\n    <p>\n      The closer we walk with Christ, the more willing we become to live honestly before Him.\n      Spiritual maturity is not measured by pretending to be without fault, but by responding\n      quickly whenever the Holy Spirit exposes sin or misplaced affections. Healthy ministry\n      grows from a heart that continually returns to the grace of God.\n    <\/p>\n\n    <div class=\"callout\">\n      \"If we confess our sins, he is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.\" \u2014 1 John 1:9\n    <\/div>\n\n    <p>\n      Confession is not merely for moments of crisis. It is a daily rhythm of bringing our\n      lives into God's light, trusting His forgiveness, and allowing Him to renew our hearts.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Why Leaders Resist Confession<\/h2>\n\n    <p>\n      Leadership can create subtle pressures that make honest confession difficult.\n      When we fear losing the respect of others, we may also begin hiding from God.\n    <\/p>\n\n    <ul>\n      <li>Fear of losing credibility.<\/li>\n      <li>Confusing spiritual leadership with personal perfection.<\/li>\n      <li>Minimizing small compromises before they become larger ones.<\/li>\n      <li>Carrying responsibilities without trusted companions.<\/li>\n    <\/ul>\n\n    <p>\n      Hidden sin rarely begins with dramatic failure. More often, it grows quietly\n      wherever honesty is postponed and God's invitation to return is ignored.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>The Grace of Returning<\/h2>\n\n    <p>\n      Biblical repentance is not about earning God's acceptance again. Because of Christ,\n      we return to a Father who is already eager to forgive and restore His children.\n    <\/p>\n\n    <ul>\n      <li>Name your sin honestly before the Lord.<\/li>\n      <li>Receive His forgiveness with gratitude and faith.<\/li>\n      <li>Make restitution and seek reconciliation where appropriate.<\/li>\n      <li>Walk forward in renewed obedience rather than lingering in shame.<\/li>\n    <\/ul>\n\n    <p>\n      A tender heart keeps ministry gracious. A hardened or defensive heart eventually\n      burdens both the pastor and the people he serves.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Living in the Light<\/h2>\n\n    <p>\n      Confession becomes a healthy rhythm when it is woven into everyday life rather\n      than reserved only for extraordinary failures.\n    <\/p>\n\n    <ul>\n      <li>Practice regular confession during your personal prayer time.<\/li>\n      <li>Invite trusted friends to speak truth into your life.<\/li>\n      <li>Examine your heart prayerfully before the Lord.<\/li>\n      <li>Seek reconciliation promptly whenever relationships are damaged.<\/li>\n    <\/ul>\n\n    <p>\n      Pastors who live honestly before God create environments where others also feel\n      safe to walk in the light of His grace.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"closing\">\n\n    <strong>Reflection<\/strong>\n\n    Is there anything you have been reluctant to bring into God's light? Take time today\n    to confess it honestly, receive His forgiveness, and rejoice that His grace is always\n    greater than your failure.\n\n    <em>\"Create in me a clean heart, O God, and renew a right spirit within me.\" \u2014 Psalm 51:10<\/em>\n\n  <\/div>\n\n"}, {"t": "From Inner Life to Gentle Leadership", "s": "Allowing a renewed heart to shape the way you shepherd God's people.", "h": "\n\n  <div class=\"banner\">\n    <h1>From Inner Life to Gentle Leadership<\/h1>\n    <p>Allowing a renewed heart to shape the way you shepherd God's people.<\/p>\n  <\/div>\n\n  <div class=\"section\">\n\n    <p><strong>The purpose of the inner life is not withdrawal from people but transformation for their good.<\/strong><\/p>\n\n    <p>\n      As Christ reshapes the heart of a pastor, He also reshapes the pastor's\n      presence among people. Leadership becomes calmer instead of hurried,\n      gracious instead of defensive, and patient instead of demanding. The\n      deepest influence of a shepherd flows not merely from giftedness but from\n      a life being continually formed by Christ.\n    <\/p>\n\n    <div class=\"callout\">\n      \"The Lord's servant must not be quarrelsome but kind to everyone... correcting his opponents with gentleness.\" \u2014 2 Timothy 2:24\u201325\n    <\/div>\n\n    <p>\n      Spiritual authority grows from Christlike character. People may admire\n      ability, but they are deeply shaped by leaders whose lives reflect the\n      gentleness, humility, and wisdom of Jesus.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Marks of Gentle Leadership<\/h2>\n\n    <p>\n      Gentle leadership is not passive or indecisive. It is strength submitted\n      to the Spirit and expressed through love.\n    <\/p>\n\n    <ul>\n      <li>Listening carefully before speaking.<\/li>\n      <li>Speaking truth with clarity and kindness.<\/li>\n      <li>Showing patience with people who are still growing.<\/li>\n      <li>Correcting without shaming or humiliating.<\/li>\n      <li>Leading with confidence rooted in God rather than in control.<\/li>\n    <\/ul>\n\n    <p>\n      Such leadership reflects the heart of the Chief Shepherd, who leads His\n      people with both truth and grace.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>How Inner Health Shapes Ministry<\/h2>\n\n    <p>\n      When a pastor is rooted in Christ, everyday ministry begins to take on a\n      different character.\n    <\/p>\n\n    <ul>\n      <li>Meetings become opportunities to listen as well as to lead.<\/li>\n      <li>Conflict becomes an opportunity for patient shepherding.<\/li>\n      <li>Decisions are guided by prayerful discernment rather than anxiety.<\/li>\n      <li>Leadership becomes an expression of loving care rather than personal achievement.<\/li>\n    <\/ul>\n\n    <p>\n      A heart at rest in Christ no longer needs to prove itself. It is free to\n      serve others with humility and joy.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"section\">\n\n    <h2>Practicing Presence<\/h2>\n\n    <p>\n      Gentle leadership is cultivated through small, intentional practices that\n      keep us attentive to God's presence throughout the day.\n    <\/p>\n\n    <ul>\n      <li>Pause before responding in difficult conversations.<\/li>\n      <li>Pray silently for people while listening to them.<\/li>\n      <li>Seek to understand before offering solutions.<\/li>\n      <li>Leave each interaction with words that encourage and bless.<\/li>\n    <\/ul>\n\n    <p>\n      Shepherds lead not only by what they say or do, but by the quiet presence\n      of Christ that others experience through them.\n    <\/p>\n\n  <\/div>\n\n  <div class=\"closing\">\n\n    <strong>Reflection<\/strong>\n\n    Where might Christ be inviting you to replace urgency with gentleness this\n    week? Ask Him to shape your leadership so that those you serve encounter His\n    patience, compassion, and peace through your life.\n\n    <em>\"Take my yoke upon you, and learn from me, for I am gentle and lowly in heart.\" \u2014 Matthew 11:29<\/em>\n\n  <\/div>\n\n"}],ART=[{"t": "Learning to Be a Shepherd", "s": "A pastoral formation course for those sensing a call to shepherd God's people", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n    <h1 style=\"margin:0;color:#365233;font-size:2.3em;font-weight:700;\">\n      Learning to Be a Shepherd\n    <\/h1>\n    <p style=\"margin-top:14px;font-size:1.1em;color:#4b5563;\">\n      A pastoral formation course for those sensing a call to shepherd God's people\n    <\/p>\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:28px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n    <p style=\"margin:0;font-style:italic;\">\n      \"Shepherd the flock of God that is among you, exercising oversight, not under compulsion, but willingly, as God would have you; not for shameful gain, but eagerly.\"\n    <\/p>\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 1 Peter 5:2 (ESV)\n    <\/p>\n  <\/div>\n\n  <!-- Welcome -->\n  <div style=\"margin-top:35px;\">\n    <h2 style=\"color:#365233;\">Welcome<\/h2>\n\n    <p>\n      Welcome to <strong>Learning to Be a Shepherd<\/strong>.\n    <\/p>\n\n    <p>\n      This course was created for members of\n      <strong>Real Life Christian Communities<\/strong> who sense that God may be\n      inviting them into deeper responsibility for the care of His people.\n    <\/p>\n\n    <p>\n      Shepherding is not a title to be claimed lightly. It is a sacred trust.\n      Before God entrusts people to our care, He first shapes our\n      <em>heart<\/em>, our <em>vision<\/em>, and our <em>character<\/em>.\n    <\/p>\n  <\/div>\n\n  <!-- What This Course Is -->\n  <div style=\"margin-top:35px;\">\n    <h2 style=\"color:#365233;\">What This Course Is<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n      <li>A <strong>formational journey<\/strong>, not an academic program.<\/li>\n      <li>A <strong>biblical and pastoral introduction<\/strong> to shepherding.<\/li>\n      <li>A place for <strong>reflection, discernment, and growth<\/strong>.<\/li>\n      <li>A resource to help the church walk wisely with you.<\/li>\n    <\/ul>\n  <\/div>\n\n  <!-- What This Course Is Not -->\n  <div style=\"margin-top:35px;\">\n    <h2 style=\"color:#365233;\">What This Course Is Not<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n      <li>Not a shortcut to becoming a pastor.<\/li>\n      <li>Not a seminary course.<\/li>\n      <li>Not a guarantee of a leadership position.<\/li>\n      <li>Not merely about gaining knowledge.<\/li>\n    <\/ul>\n\n    <p>\n      Instead, this course helps you ask honest questions about your calling,\n      your readiness, and the next steps God may be inviting you to take.\n    <\/p>\n  <\/div>\n\n  <!-- Why Shepherd -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n    <h2 style=\"margin-top:0;color:#365233;\">Why \"Shepherd\"?<\/h2>\n\n    <p>\n      Throughout Scripture, God describes His people as a\n      <strong>flock<\/strong> and their leaders as\n      <strong>shepherds<\/strong>.\n    <\/p>\n\n    <p>\n      A shepherd does more than lead from the front. Shepherds watch over,\n      protect, guide, nourish, encourage, and remain with the flock\u2014\n      especially when doing so is costly.\n    <\/p>\n\n    <p>\n      Learning pastoral leadership begins by learning how to\n      <em>be a shepherd<\/em>.\n    <\/p>\n  <\/div>\n\n  <!-- SHEPHERD -->\n  <div style=\"margin-top:40px;\">\n    <h2 style=\"color:#365233;\">The SHEPHERD Framework<\/h2>\n\n    <p>\n      This course is organized around the acrostic\n      <strong>SHEPHERD<\/strong>, highlighting eight essential dimensions of\n      pastoral leadership.\n    <\/p>\n\n    <ol style=\"padding-left:24px;\">\n      <li><strong>S<\/strong> \u2014 See God's vision for the church.<\/li>\n      <li><strong>H<\/strong> \u2014 Harness the potential of the church.<\/li>\n      <li><strong>E<\/strong> \u2014 Equip the members of the church.<\/li>\n      <li><strong>P<\/strong> \u2014 Provide soul care for the church.<\/li>\n      <li><strong>H<\/strong> \u2014 Harmonize relationships within the church.<\/li>\n      <li><strong>E<\/strong> \u2014 Empower leaders in the church.<\/li>\n      <li><strong>R<\/strong> \u2014 Run the administrative affairs of the church.<\/li>\n      <li><strong>D<\/strong> \u2014 Design healthy ministry systems.<\/li>\n    <\/ol>\n  <\/div>\n\n  <!-- How to Use -->\n  <div style=\"margin-top:40px;\">\n    <h2 style=\"color:#365233;\">How to Use This Course<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n      <li>Move through each lesson at your own pace.<\/li>\n      <li>Read prayerfully rather than hurriedly.<\/li>\n      <li>Answer the reflection questions honestly.<\/li>\n      <li>Allow God to shape your heart, not merely your skills.<\/li>\n    <\/ul>\n\n    <p>\n      There are no exams or papers. What matters most is your willingness to\n      remain open before God as He forms you for His service.\n    <\/p>\n  <\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin-top:0;margin-bottom:14px;color:#365233;\">\n      A Gentle Invitation\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      If the Lord is calling you to shepherd His people, He is also committed\n      to forming you. Walk through this course prayerfully, humbly, and\n      expectantly, trusting that the Chief Shepherd is preparing you to care\n      for His flock.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"And when the Chief Shepherd appears, you will receive the unfading crown of glory.\" \u2014 1 Peter 5:4\n    <\/p>\n\n  <\/div>\n\n<\/div>"}, {"t": "S \u2013 See God's Vision for the Church", "s": "Learning to see the church the way God sees His people.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 1\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      S \u2013 See God's Vision for the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Learning to see the church the way God sees His people.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"Now you are the body of Christ and individually members of it.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 1 Corinthians 12:27 (ESV)\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      Every shepherd leads from a vision, whether he realizes it or not.\n    <\/p>\n\n    <p>\n      If our understanding of the church is shaped primarily by programs,\n      preferences, frustrations, or past experiences, our shepherding will\n      eventually reflect those influences. Before God entrusts people to our\n      care, He first invites us to see His church through His eyes.\n    <\/p>\n\n    <p>\n      Healthy shepherding begins with a biblical vision of God's people.\n    <\/p>\n\n  <\/div>\n\n  <!-- Biblical Images -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">How Scripture Describes the Church<\/h2>\n\n    <p>\n      The Bible uses several rich images to reveal the nature of God's people.\n      Each one teaches us something important about how a shepherd should think\n      about those entrusted to his care.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li><strong>The Body<\/strong> \u2014 Every member matters and contributes to the whole (1 Corinthians 12).<\/li>\n\n      <li><strong>The Family<\/strong> \u2014 God's household, marked by love, belonging, and mutual care (Ephesians 2:19).<\/li>\n\n      <li><strong>The Flock<\/strong> \u2014 People who need guidance, protection, and nourishment (John 10).<\/li>\n\n      <li><strong>The Temple<\/strong> \u2014 A dwelling place for God's presence (1 Peter 2:5).<\/li>\n\n      <li><strong>A People on Mission<\/strong> \u2014 Sent into the world to bear witness to Christ (Matthew 28:19\u201320).<\/li>\n\n    <\/ul>\n\n  <\/div>\n\n  <!-- Shepherd's Perspective -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">A Shepherd's Way of Seeing<\/h2>\n\n    <p>\n      A shepherd does not primarily see the church as:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>A crowd to impress.<\/li>\n\n      <li>A problem to solve.<\/li>\n\n      <li>An organization to manage.<\/li>\n\n      <li>A machine to optimize.<\/li>\n\n    <\/ul>\n\n    <p>\n      Instead, a shepherd sees people deeply loved by God and entrusted to his\n      care for a season.\n    <\/p>\n\n  <\/div>\n\n  <!-- Warning -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">A Gentle Warning<\/h2>\n\n    <p>\n      When leaders lose God's vision for His church, they often begin to:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Value results more than people.<\/li>\n\n      <li>Prioritize efficiency over faithfulness.<\/li>\n\n      <li>Lead from frustration instead of compassion.<\/li>\n\n      <li>Forget that the flock ultimately belongs to Christ.<\/li>\n\n    <\/ul>\n\n    <p>\n      Learning to shepherd begins by allowing God to reshape how we see His people.\n    <\/p>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      Spend time with the Lord before answering these questions.\n      Invite Him to shape not only your thinking but also your heart.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>Which biblical picture of the church speaks most deeply to you today? Why?<\/li>\n\n      <li>How have you tended to view the church in the past\u2014as people, programs, or problems?<\/li>\n\n      <li>What changes might God be inviting you to make in the way you see His people?<\/li>\n\n      <li>How does your present view of the church influence the way you serve others?<\/li>\n\n    <\/ol>\n\n  <\/div>\n\n  <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      A Final Encouragement\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      Faithful shepherding begins long before leading others. Ask God to shape\n      your vision so that you see His church with His compassion, His wisdom,\n      and His love. As your vision changes, your leadership will follow.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"Now you are the body of Christ and individually members of it.\" \u2014 1 Corinthians 12:27\n    <\/p>\n\n  <\/div>\n\n<\/div>"}, {"t": "H \u2013 Harness the Potential of the Church", "s": "Learning to steward what God has already entrusted.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 2\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      H \u2013 Harness the Potential of the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Learning to steward what God has already entrusted.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"As each has received a gift, use it to serve one another, as good stewards of God's varied grace.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 1 Peter 4:10 (ESV)\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      Every local church already possesses God-given potential.\n    <\/p>\n\n    <p>\n      Shepherds are not called to manufacture ministry through their own abilities.\n      Rather, they are called to recognize, steward, and develop the people, gifts,\n      and opportunities that God has already placed within the church.\n    <\/p>\n\n    <p>\n      When these gifts remain unnoticed or underused, the church struggles to flourish.\n      When they are lovingly cultivated, the whole body grows in maturity and service.\n    <\/p>\n\n  <\/div>\n\n  <!-- Stewardship -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">From Control to Stewardship<\/h2>\n\n    <p>\n      Faithful shepherds never forget that the church belongs to Christ.\n      They are stewards rather than owners.\n    <\/p>\n\n    <p>\n      Stewardship begins with careful observation, prayerful listening,\n      and humble discernment.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Who has God entrusted to this church?<\/li>\n\n      <li>What gifts, experiences, and passions are already present?<\/li>\n\n      <li>What season is this congregation currently experiencing?<\/li>\n\n      <li>Where does God already seem to be at work?<\/li>\n\n    <\/ul>\n\n  <\/div>\n\n  <!-- Information -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Seeing Clearly Before Leading Wisely<\/h2>\n\n    <p>\n      Good shepherds pay attention.\n    <\/p>\n\n    <p>\n      Attendance patterns, ministry involvement, spiritual growth,\n      and personal conversations all help us understand how God is\n      working among His people.\n    <\/p>\n\n    <p>\n      Information does not replace prayer or dependence on the Holy Spirit.\n      It simply helps shepherds exercise wise and faithful stewardship.\n    <\/p>\n\n  <\/div>\n\n  <!-- Strategy -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Pastoral Strategy with a Shepherd's Heart<\/h2>\n\n    <p>\n      Strategy in the church is not primarily about efficiency.\n      It is about helping people become mature followers of Christ.\n    <\/p>\n\n    <p>\n      Healthy shepherds continually ask:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Are our ministries helping people grow spiritually?<\/li>\n\n      <li>Are people serving where God has gifted them?<\/li>\n\n      <li>Are we placing unnecessary burdens on our volunteers?<\/li>\n\n      <li>How can we better serve people rather than simply fill programs?<\/li>\n\n    <\/ul>\n\n    <p>\n      Strategy becomes pastoral when it serves people instead of merely accomplishing tasks.\n    <\/p>\n\n  <\/div>\n\n  <!-- Pitfalls -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Common Pitfalls to Avoid<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Copying another church without prayerful discernment.<\/li>\n\n      <li>Depending on a few faithful people while overlooking others.<\/li>\n\n      <li>Confusing busyness with spiritual fruitfulness.<\/li>\n\n      <li>Making decisions without listening carefully to God's people.<\/li>\n\n    <\/ul>\n\n    <p>\n      Harnessing potential requires humility, patience, and the willingness\n      to recognize what God is already doing before trying to do something new.\n    <\/p>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      Prayerfully reflect on these questions before moving to the next lesson.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>How do you normally think about the potential of the church?<\/li>\n\n      <li>Where might God be inviting you to become more of a steward than a controller?<\/li>\n\n      <li>What people or gifts seem underutilized in your church?<\/li>\n\n      <li>How can planning become an act of love instead of pressure?<\/li>\n\n    <\/ol>\n\n  <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      A Final Encouragement\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      God has already entrusted His church with people, gifts, experiences,\n      and opportunities for ministry. Ask Him to give you the wisdom to recognize\n      these gifts and the humility to steward them faithfully for His glory and\n      the good of His people.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"As each has received a gift, use it to serve one another, as good stewards of God's varied grace.\" \u2014 1 Peter 4:10\n    <\/p>\n\n  <\/div>\n\n<\/div><\/div>"}, {"t": "E \u2013 Equip the Members of the Church", "s": "Helping God's people grow, serve, and mature in Christ.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 3\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      E \u2013 Equip the Members of the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Helping God's people grow, serve, and mature in Christ.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"And he gave the apostles, the prophets, the evangelists, the shepherds and teachers, to equip the saints for the work of ministry, for building up the body of Christ.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 Ephesians 4:11\u201312 (ESV)\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      One of the clearest responsibilities of a shepherd is to equip God's people for ministry.\n    <\/p>\n\n    <p>\n      Healthy churches are not built by pastors who do everything themselves. They are built by pastors who patiently help believers discover their gifts, develop their faith, and participate in God's mission.\n    <\/p>\n\n    <p>\n      Equipping is not about maintaining control. It is about preparing others to serve Christ faithfully and joyfully.\n    <\/p>\n\n  <\/div>\n\n  <!-- Equipping -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Equipping Is More Than Doing Ministry<\/h2>\n\n    <p>\n      It is easy for leaders to become so busy serving that they unintentionally prevent others from growing.\n      Shepherds equip by investing in people, not merely by accomplishing tasks.\n    <\/p>\n\n    <p>\n      Faithful shepherds:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Teach God's Word with clarity and patience.<\/li>\n\n      <li>Train others to serve with growing confidence.<\/li>\n\n      <li>Create opportunities for meaningful ministry.<\/li>\n\n      <li>Allow people to learn, even when mistakes are part of the process.<\/li>\n\n    <\/ul>\n\n    <p>\n      Equipping requires humility, patience, and the willingness to share responsibility.\n    <\/p>\n\n  <\/div>\n\n  <!-- How Shepherds Equip -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">How Shepherds Equip the Church<\/h2>\n\n    <p>\n      God ordinarily equips His people through shepherds who faithfully devote themselves to three important ministries.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li><strong>Preaching<\/strong> \u2014 proclaiming God's Word so that faith is strengthened and lives are transformed.<\/li>\n\n      <li><strong>Teaching<\/strong> \u2014 helping believers understand and apply Scripture wisely.<\/li>\n\n      <li><strong>Training<\/strong> \u2014 providing practical opportunities for ministry, service, and leadership development.<\/li>\n\n    <\/ul>\n\n    <p>\n      These ministries bear fruit when they are carried out consistently, intentionally, and with genuine love for God's people.\n    <\/p>\n\n  <\/div>\n\n  <!-- Goal -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">The Goal: Spiritual Maturity<\/h2>\n\n    <p>\n      The success of equipping is not measured by attendance or activity alone. It is measured by growing maturity in Christ.\n    <\/p>\n\n    <p>\n      Mature believers increasingly:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Reflect the character of Christ.<\/li>\n\n      <li>Speak the truth with love and humility.<\/li>\n\n      <li>Serve according to their spiritual gifts.<\/li>\n\n      <li>Remain faithful through changing seasons of life.<\/li>\n\n    <\/ul>\n\n    <p>\n      A faithful shepherd rejoices when the whole body grows stronger and every member contributes to the church's mission.\n    <\/p>\n\n  <\/div>\n\n  <!-- Mistakes -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Common Mistakes to Avoid<\/h2>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Giving people responsibilities without preparation.<\/li>\n\n      <li>Teaching biblical truth without practical application.<\/li>\n\n      <li>Training people without providing encouragement and follow-up.<\/li>\n\n      <li>Expecting maturity to develop overnight.<\/li>\n\n    <\/ul>\n\n    <p>\n      Equipping is a lifelong process that requires grace, encouragement, and perseverance.\n    <\/p>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      Spend time prayerfully considering the questions below before moving to the next lesson.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>How have others equipped you in your own spiritual journey?<\/li>\n\n      <li>Do you naturally take responsibility for everything, or do you intentionally help others grow?<\/li>\n\n      <li>Who might God be inviting you to encourage, train, or mentor?<\/li>\n\n      <li>What fears make it difficult for you to entrust ministry to others?<\/li>\n\n    <\/ol>\n\n  <\/div>\n\n  <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      A Final Encouragement\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      Faithful shepherds measure success not by how indispensable they become,\n      but by how well God's people are equipped to love, serve, and build up one another.\n      Invest in people patiently, and trust the Lord to bring the growth.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"To equip the saints for the work of ministry, for building up the body of Christ.\" \u2014 Ephesians 4:12\n    <\/p>\n\n  <\/div>\n\n<\/div>"}, {"t": "P \u2013 Provide Soul Care for the Church", "s": "Shepherding hearts through presence, prayer, and spiritual formation.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 4\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      P \u2013 Provide Soul Care for the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Shepherding hearts through presence, prayer, and spiritual formation.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"I will give you shepherds after my own heart, who will feed you with knowledge and understanding.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 Jeremiah 3:15 (ESV)\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      At the heart of pastoral ministry is the care of souls.\n    <\/p>\n\n    <p>\n      Churches may have sound doctrine, effective ministries, and well-organized\n      systems, yet still neglect the spiritual well-being of the people God has\n      entrusted to them. Faithful shepherds never lose sight of the people behind\n      the programs.\n    <\/p>\n\n    <p>\n      The calling of a shepherd is not merely to organize ministry but to lovingly\n      guide people toward deeper fellowship with Christ.\n    <\/p>\n\n  <\/div>\n\n  <!-- Soul Care -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">What Is Soul Care?<\/h2>\n\n    <p>\n      Soul care is the intentional and prayerful ministry of helping people grow\n      in their relationship with God and become more like Christ.\n    <\/p>\n\n    <p>\n      It includes:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Listening with compassion and genuine attention.<\/li>\n\n      <li>Helping people discern God's work in their lives.<\/li>\n\n      <li>Encouraging practices that cultivate spiritual maturity.<\/li>\n\n      <li>Walking faithfully with people through seasons of joy, struggle, and suffering.<\/li>\n\n    <\/ul>\n\n  <\/div>\n\n  <!-- Presence -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">The Ministry of Presence<\/h2>\n\n    <p>\n      One of the greatest gifts a shepherd offers is his presence.\n    <\/p>\n\n    <p>\n      Pastors do not always need to provide immediate answers. Often, what people\n      need most is someone who will patiently remain with them in God's presence.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Listen without rushing.<\/li>\n\n      <li>Give people your full attention.<\/li>\n\n      <li>Pray sincerely and expectantly.<\/li>\n\n      <li>Remain faithfully present during seasons of pain and uncertainty.<\/li>\n\n    <\/ul>\n\n    <p>\n      Loving presence often speaks more deeply than hurried advice.\n    <\/p>\n\n  <\/div>\n\n  <!-- Spiritual Formation -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Soul Care and Spiritual Formation<\/h2>\n\n    <p>\n      Caring for souls means helping people develop rhythms that continually open\n      their lives to God's transforming grace.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Prayer and meditation on Scripture.<\/li>\n\n      <li>Confession and repentance.<\/li>\n\n      <li>Sabbath and healthy rhythms of rest.<\/li>\n\n      <li>Community, accountability, and mutual encouragement.<\/li>\n\n    <\/ul>\n\n    <p>\n      Spiritual formation usually happens slowly, quietly, and faithfully over\n      time as people continue walking with Christ.\n    <\/p>\n\n  <\/div>\n\n  <!-- Limits -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Knowing Your Limits<\/h2>\n\n    <p>\n      Providing soul care does not mean becoming everyone's rescuer.\n    <\/p>\n\n    <p>\n      Wise shepherds recognize both their calling and their limitations.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Know when to listen and when to refer someone for additional help.<\/li>\n\n      <li>Respect healthy personal boundaries.<\/li>\n\n      <li>Care faithfully for your own soul.<\/li>\n\n      <li>Depend on the Holy Spirit rather than your own strength.<\/li>\n\n    <\/ul>\n\n    <p>\n      Shepherds can only give what they themselves continue receiving from Christ.\n    <\/p>\n\n  <\/div>\n\n  <!-- Reflection -->\n  <div style=\"margin-top:40px;padding:24px;background:#f4f6f2;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Personal Reflection<\/h2>\n\n    <p>\n      Spend time prayerfully reflecting on the questions below.\n    <\/p>\n\n    <ol style=\"padding-left:22px;\">\n\n      <li>Who has cared well for your soul, and what did you learn from that experience?<\/li>\n\n      <li>Which aspect of soul care comes most naturally to you? Which feels most difficult?<\/li>\n\n      <li>How are you currently tending your own relationship with Christ?<\/li>\n\n      <li>What might God be inviting you to change so that you can care for others more faithfully?<\/li>\n\n    <\/ol>\n\n  <\/div>\n\n <!-- Reflection Options -->\n<div style=\"\n  margin:40px auto;\n  padding:30px 20px;\n  max-width:700px;\n  text-align:center;\n  background:#f8fafc;\n  border:1px solid #e5e7eb;\n  border-radius:12px;\n  font-family:Arial, sans-serif;\n\">\n\n  <h3 style=\"\n    margin-bottom:15px;\n    color:#111827;\n    font-size:24px;\n  \">\n    Don't Keep It to Yourself\n  <\/h3>\n\n  <p style=\"\n    color:#4b5563;\n    font-size:16px;\n    line-height:1.6;\n    margin-bottom:30px;\n  \">\n    One of the best ways to deepen what God is teaching you is to put it into words. I invite you to share your reflection with your Instructor, with yourself, or with someone who can come alongside you in your spiritual journey.\n  <\/p>\n\n  <!-- Option 1 -->\n  <div style=\"\n    margin-bottom:30px;\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      1. Share It with your Instructor\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      I would love to read your reflection, pray for you, and encourage you as you continue following Jesus. Please include a meaningful subject line so I can respond more efficiently.\n    <\/p>\n\n    <a href=\"mailto:rlccphil@gmail.com\" style=\"\n         display:inline-block;\n         background:#365233;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Instructor\n    <\/a>\n\n  <\/div>\n\n  <!-- Divider -->\n  <div style=\"\n    margin:25px 0;\n    color:#9ca3af;\n    font-size:15px;\n    font-weight:bold;\n    letter-spacing:1px;\n  \">\n    THEN...\n  <\/div>\n\n  <!-- Option 2 -->\n  <div style=\"\n    padding:24px;\n    background:#ffffff;\n    border:1px solid #e5e7eb;\n    border-radius:10px;\n  \">\n\n    <h4 style=\"\n      margin:0 0 12px;\n      color:#111827;\n      font-size:20px;\n    \">\n      2. Share It with Yourself or Someone You Trust\n    <\/h4>\n\n    <p style=\"\n      color:#4b5563;\n      font-size:15px;\n      line-height:1.6;\n      margin-bottom:20px;\n    \">\n      After you've shared your reflection with your Instructor, consider sending it to yourself, a mentor, an accountability partner, your spouse, trusted friend, or someone else who is walking with you in your faith. Inviting others into your spiritual journey can deepen your growth and strengthen your relationships.\n    <\/p>\n\n    <a href=\"mailto:\" style=\"\n         display:inline-block;\n         background:#6b7280;\n         color:#ffffff;\n         padding:14px 28px;\n         border-radius:8px;\n         text-decoration:none;\n         font-size:16px;\n         font-weight:600;\n       \">\n       \u2709\ufe0f Email to Yourself or Someone Else\n    <\/a>\n\n  <\/div>\n\n<\/div>\n\n  <!-- Footer -->\n  <div style=\"margin-top:40px;background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:26px;text-align:center;\">\n\n    <h2 style=\"margin:0 0 14px;color:#365233;\">\n      A Final Encouragement\n    <\/h2>\n\n    <p style=\"margin:0;color:#4b5563;\">\n      Shepherds after God's own heart care for people patiently, prayerfully,\n      and with genuine compassion. As you continue to nurture your own soul in\n      Christ, He will increasingly use you to nurture the souls of others.\n    <\/p>\n\n    <p style=\"margin-top:18px;font-style:italic;color:#365233;\">\n      \"I will give you shepherds after my own heart, who will feed you with knowledge and understanding.\" \u2014 Jeremiah 3:15\n    <\/p>\n\n  <\/div>\n\n<\/div>"}, {"t": "H \u2013 Harmonize Relationships within the Church", "s": "Practicing peacemaking, truth, and love in God's household.", "h": "<div style=\"font-family:Arial,Helvetica,sans-serif;line-height:1.7;color:#2e2e2e;max-width:800px;margin:0 auto;\">\n\n  <!-- Header -->\n  <div style=\"background:#f4f7f4;border:2px solid #365233;border-radius:12px;padding:32px 28px;text-align:center;\">\n\n    <h1 style=\"margin:0;color:#365233;font-size:2.2em;font-weight:700;\">\n      Lesson 5\n    <\/h1>\n\n    <h2 style=\"margin:12px 0 0;color:#365233;font-size:1.7em;font-weight:600;\">\n      H \u2013 Harmonize Relationships within the Church\n    <\/h2>\n\n    <p style=\"margin-top:16px;color:#4b5563;font-size:1.1em;\">\n      Practicing peacemaking, truth, and love in God's household.\n    <\/p>\n\n  <\/div>\n\n  <!-- Scripture -->\n  <div style=\"margin-top:30px;padding:20px;background:#f4f6f2;border-left:5px solid #365233;border-radius:8px;\">\n\n    <p style=\"margin:0;font-style:italic;\">\n      \"If possible, so far as it depends on you, live peaceably with all.\"\n    <\/p>\n\n    <p style=\"margin-top:10px;font-weight:bold;color:#365233;\">\n      \u2014 Romans 12:18 (ESV)\n    <\/p>\n\n  <\/div>\n\n  <!-- Why This Matters -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">Why This Matters<\/h2>\n\n    <p>\n      Wherever people gather, relationships will eventually be tested.\n    <\/p>\n\n    <p>\n      The church is God's family. Because we love one another deeply, disagreements,\n      misunderstandings, and disappointments are inevitable. These moments are not\n      interruptions to ministry\u2014they are opportunities for shepherding.\n    <\/p>\n\n    <p>\n      Faithful shepherds neither avoid conflict nor inflame it. Instead, they seek\n      to preserve unity by speaking the truth with humility, courage, and love.\n    <\/p>\n\n  <\/div>\n\n  <!-- Peacemaking -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">The Shepherd's Call to Peacemaking<\/h2>\n\n    <p>\n      Biblical peacemaking is more than keeping everyone happy. It is participating\n      in God's work of reconciliation by helping people move toward truth,\n      forgiveness, and restored relationships.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Listen carefully before speaking.<\/li>\n\n      <li>Seek understanding before drawing conclusions.<\/li>\n\n      <li>Speak truth with gentleness and grace.<\/li>\n\n      <li>Protect unity without compromising biblical integrity.<\/li>\n\n    <\/ul>\n\n  <\/div>\n\n  <!-- Loving Intervention -->\n  <div style=\"margin-top:35px;padding:24px;background:#eef3ee;border-radius:10px;\">\n\n    <h2 style=\"margin-top:0;color:#365233;\">Loving and Faithful Intervention<\/h2>\n\n    <p>\n      Sometimes shepherding requires difficult conversations.\n    <\/p>\n\n    <p>\n      Loving intervention may include:\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Addressing harmful attitudes or behaviors.<\/li>\n\n      <li>Clarifying misunderstandings before they deepen.<\/li>\n\n      <li>Calling people back to biblical truth.<\/li>\n\n      <li>Helping wounded people move toward reconciliation.<\/li>\n\n    <\/ul>\n\n    <p>\n      Such conversations are never about winning arguments. They are expressions\n      of genuine love for Christ and His people.\n    <\/p>\n\n  <\/div>\n\n  <!-- Shepherd's Posture -->\n  <div style=\"margin-top:35px;\">\n\n    <h2 style=\"color:#365233;\">The Heart of a Shepherd<\/h2>\n\n    <p>\n      The manner in which a shepherd responds to conflict often speaks more loudly\n      than the solution itself.\n    <\/p>\n\n    <ul style=\"padding-left:22px;\">\n\n      <li>Humility instead of defensiveness.<\/li>\n\n      <li>Gentleness instead of force.<\/li>\n\n      <li>Clarity instead of a
